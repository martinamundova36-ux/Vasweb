<!doctype html><html lang="sk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Student House Bratislava – Náhľad vnútra aplikácie</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#edf3fa;color:#142b4d;font:15px system-ui,-apple-system,"Segoe UI",Arial,sans-serif}button{font:inherit;cursor:pointer}a{color:inherit}
.banner{position:sticky;top:0;z-index:10;background:#fff7e8;border-bottom:1px solid #ebcf96;padding:11px clamp(15px,3vw,44px);color:#73501e;font-size:13px;font-weight:700;display:flex;justify-content:space-between;gap:12px;align-items:center}.banner a{font-weight:700}
.shell{max-width:1390px;margin:0 auto;padding:30px clamp(13px,3vw,38px)}
.head{background:linear-gradient(110deg,#142b4d,#204b77);border-radius:24px;padding:34px clamp(21px,4vw,44px);color:white;display:flex;justify-content:space-between;gap:25px;align-items:flex-start;box-shadow:0 12px 28px #142b4d20}
.brand{font-size:13px;font-weight:800;letter-spacing:.15em;color:#c9d7e8}.head h1{margin:12px 0 8px;font-size:clamp(30px,4vw,43px);letter-spacing:-.04em}.head p{margin:0;color:#cbdaf0;line-height:1.5}.switch{display:flex;gap:8px;flex-wrap:wrap}.switch button{border:1px solid #93aec8;border-radius:11px;padding:12px 14px;background:#315a82;color:white;white-space:nowrap}.switch .selected{background:#fff;color:#142b4d;font-weight:800}
.nav{display:flex;flex-wrap:wrap;gap:10px;margin:25px 0 20px}.nav button{padding:12px 16px;border-radius:13px;background:#fff;border:1px solid #dbe6f3;color:#142b4d;font-weight:700}.nav button.active{background:#142b4d;color:#fff}
.panel{background:white;border:1px solid #dce7f3;border-radius:21px;min-height:400px;padding:clamp(18px,3vw,31px);box-shadow:0 12px 28px #142b4d0a}.panel h2{margin:0 0 7px;font-size:26px}.lead{color:#60748b;margin:0 0 25px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin:23px 0}.stat{background:#f8fbff;border:1px solid #dde7f3;border-radius:16px;padding:21px}.stat small{display:block;color:#57708d;font-weight:700}.stat strong{display:block;font-size:30px;margin-top:11px}
.records{display:grid;gap:11px}.item{background:#f9fbff;border:1px solid #e3eaf2;border-radius:12px;padding:16px}.item strong{display:block}.item .sub{font-size:13px;color:#62768d;margin-top:6px}.pill{display:inline-block;background:#fff0d8;color:#755320;font-size:12px;padding:5px 9px;border-radius:99px;margin-top:8px;font-weight:800}.pill.green{background:#daf1e5;color:#14633e}
.note{font-size:13px;color:#59708b;margin-top:19px;border-left:3px solid #8eabd0;padding:12px;background:#f1f6fc;border-radius:8px}.actions{margin-top:15px;display:flex;gap:7px;flex-wrap:wrap}.actions button{background:#e7eef8;color:#203c5d;border:0;padding:9px 12px;border-radius:8px;font-weight:700}.actions button:disabled{opacity:.6;cursor:not-allowed}
footer{padding:23px 5px;font-size:12px;color:#617188}
@media(max-width:760px){.banner{align-items:flex-start}.shell{padding:15px 12px}.head{display:block;border-radius:16px;padding:22px}.switch{margin-top:21px}.nav{overflow-x:auto;flex-wrap:nowrap;padding-bottom:7px}.nav button{white-space:nowrap}.stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.stat{padding:14px}.stat strong{font-size:25px}.panel{padding:18px;border-radius:15px}.panel h2{font-size:23px}}
</style></head><body>
<div class="banner"><span>UKÁŽKA VNÚTRA APLIKÁCIE · Iba ilustračné údaje, bez prihlásenia a bez zápisov do databázy</span><a href="index.html">Späť na prihlasovanie</a></div>
<div class="shell"><header class="head"><div><div class="brand">STUDENT HOUSE BRATISLAVA</div><h1 id="heading">Moja študentská zóna</h1><p id="subline">Ubytovanie, dokumenty a požiadavky na jednom mieste.</p></div><div class="switch" aria-label="Vybrať náhľad"><button id="student" class="selected">Študent</button><button id="reception">Recepcia</button></div></header><nav class="nav" aria-label="Sekcie portálu" id="nav"></nav><main class="panel" id="panel" aria-live="polite"></main><footer>Student House Bratislava · Náhľad WEBU Residence · Designed by WEBU</footer></div>
<script>
(()=>{'use strict';
const sample={
student:{
 overview:{title:'Vitajte v študentskej zóne',description:'Tu sa zobrazujú tvoje údaje po prihlásení.',stats:[['Moja izba','A-101'],['Nájomné','300 €'],['Evidované úhrady','300 €'],['Otvorené žiadosti','1']],items:[['Ubytovanie','Ilustračná zmluva · 01. 09. 2026 – 30. 06. 2027'],['Oznam recepcie','Nočný pokoj 22:00 – 06:00']]},
 rooms:{title:'Moja izba',description:'Údaje podľa tvojej ubytovacej zmluvy.',items:[['Izba A-101','Obdobie pobytu: 01. 09. 2026 – 30. 06. 2027'],['Mesačné nájomné','300 € · splatnosť podľa zmluvy']]},
 payments:{title:'Moje platby',description:'Zoznam predpisov a evidovaných úhrad.',items:[['Predpis nájomného','November 2026 · 300 € · splatné do 05. 11. 2026'],['Evidovaná úhrada','300 € · bankový prevod', 'Zaúčtované']]},
 installments:{title:'Splátkový kalendár',description:'Individuálne schválené splátky.',items:[['Ilustračný splátkový plán','15. 11. 2026 · 150 €'],['Druhá splátka','30. 11. 2026 · 150 €']]},
 documents:{title:'Moje dokumenty',description:'Súkromné súbory dostupné len tebe.',items:[['Ubytovacia zmluva','PDF · na stiahnutie po overení'],['Potvrdenie o ubytovaní','Dokument priradí recepcia']]},
 requests:{title:'Moje požiadavky',description:'Opravy, dokumenty a otázky pre recepciu.',items:[['Oprava okna','Nahlásené · spracúva recepcia','Nová požiadavka']]},
 cleaning:{title:'Upratovanie izby',description:'Požiadaj o upratovanie a sleduj potvrdenie termínu.',items:[['Žiadosť o upratovanie','Preferovaný dátum: 18. 11. 2026','Čaká na potvrdenie']]},
 notices:{title:'Oznamy',description:'Dôležité informácie recepcie.',items:[['Otváracie hodiny recepcie','Pondelok – piatok · 08:30 – 16:30'],['Pokyny pre študentov','Sleduj aktuálne oznamy a ubytovací poriadok']]}
},
reception:{
 overview:{title:'Prehľad recepcie',description:'Registrácie, študenti a prevádzka v jednom paneli.',stats:[['Na overenie','3'],['Študenti','64'],['Izby','36'],['Upratovanie','2']],items:[['Nová registrácia','Overiť zmluvu a následne aktivovať účet'],['Nová žiadosť o upratovanie','Potvrdiť termín a cenu']]},
 registrations:{title:'Registrácie študentov',description:'Overenie údajov zo zmluvy pred aktivovaním účtu.',items:[['Nová registrácia – DEMO','Meno, izba, číslo zmluvy a obdobie pobytu','Čaká na overenie'],['Overená registrácia – DEMO','Odoslanie prihlasovacej pozvánky','Pozvánka odoslaná']]},
 residents:{title:'Správa študentov',description:'Prehľad priradených obyvateľov.',items:[['Ukážkový študent','Izba A-101 · aktívny pobyt'],['Ďalší záznam','Evidované údaje študenta']]},
 rooms:{title:'Izby a kapacity',description:'Zoznam izieb podľa zariadenia.',items:[['A-101','Dvojlôžková · kapacita 2'],['A-102','Apartmán · kapacita 2']]},
 payments:{title:'Platby a nájomné',description:'Evidencia predpisov a úhrad.',items:[['Mesačný predpis','November 2026 · 300 €'],['Banková úhrada','Ukážková evidovaná platba · 300 €']]},
 installments:{title:'Splátkové kalendáre',description:'Schválené individuálne splátky študentov.',items:[['Ukážkový splátkový plán','2 splátky · 150 € + 150 €']]},
 documents:{title:'Dokumenty',description:'Spoločné a osobné dokumenty s riadeným prístupom.',items:[['Ubytovací poriadok','Verejný dokument'],['Osobná zmluva študenta','Prístup len pre konkrétneho študenta']]},
 requests:{title:'Požiadavky študentov',description:'Zmeň stav a pridaj poznámku.',items:[['Nahlásená oprava okna','Stav: Nová · priradené recepcii','Nová'],['Potvrdenie o ubytovaní','Stav: Vybavuje sa','Prebieha']]},
 cleaning:{title:'Správa upratovania',description:'Potvrdzovanie termínov a cien.',items:[['Žiadosť o upratovanie','Izba A-101 · preferovaný termín 18. 11. 2026','Čaká'],['Schválené upratovanie','Cena a termín potvrdené recepciou','Schválené']]},
 notices:{title:'Oznamy',description:'Zverejňovanie správ pre študentov.',items:[['Recepcia – nové hodiny','Oznam v štyroch jazykoch'],['Víkendový režim','Pokyny k prístupovým kartám']]}
}};
const tabs={student:[['overview','Prehľad'],['rooms','Moja izba'],['payments','Platby'],['installments','Splátky'],['documents','Dokumenty'],['requests','Požiadavky'],['cleaning','Upratovanie'],['notices','Oznamy']],reception:[['overview','Prehľad'],['registrations','Registrácie'],['residents','Študenti'],['rooms','Izby'],['payments','Platby'],['installments','Splátky'],['documents','Dokumenty'],['requests','Požiadavky'],['cleaning','Upratovanie'],['notices','Oznamy']]};
let role='student',active='overview';const $=id=>document.getElementById(id);
function render(){
$('heading').textContent=role==='student'?'Moja študentská zóna':'Administrácia recepcie';
$('subline').textContent=role==='student'?'Ubytovanie, dokumenty a požiadavky na jednom mieste.':'Prehľad registrácií, rezervácií a prevádzky Student House Bratislava.';
for(const x of ['student','reception'])$(x).classList.toggle('selected',x===role);
const nav=$('nav');nav.replaceChildren();
tabs[role].forEach(([key,name])=>{const btn=document.createElement('button');btn.textContent=name;btn.type='button';btn.classList.toggle('active',key===active);btn.onclick=()=>{active=key;render()};nav.append(btn)});
const panel=$('panel'),data=sample[role][active];panel.replaceChildren();
const h=document.createElement('h2');h.textContent=data.title;panel.append(h);
const lead=document.createElement('p');lead.className='lead';lead.textContent=data.description;panel.append(lead);
if(data.stats){const box=document.createElement('div');box.className='stats';data.stats.forEach(([name,value])=>{const c=document.createElement('div');c.className='stat';const n=document.createElement('small');n.textContent=name;const v=document.createElement('strong');v.textContent=value;c.append(n,v);box.append(c)});panel.append(box)}
const records=document.createElement('div');records.className='records';
data.items.forEach(([title,details,status])=>{const card=document.createElement('div');card.className='item';const s=document.createElement('strong');s.textContent=title;const t=document.createElement('div');t.className='sub';t.textContent=details;card.append(s,t);if(status){const p=document.createElement('span');p.className='pill'+(/Schválené|Zaúčtované|Pozvánka odoslaná/.test(status)?' green':'');p.textContent=status;card.append(p)}records.append(card)});
panel.append(records);
const note=document.createElement('p');note.className='note';note.textContent='Toto je ukážka vzhľadu. Skutočné údaje, zápisy a sťahovanie dokumentov fungujú výlučne po autorizovanom prihlásení do hlavného portálu.';panel.append(note);
}
$('student').onclick=()=>{role='student';active='overview';render()};
$('reception').onclick=()=>{role='reception';active='overview';render()};
render();
})();</script></body></html>
