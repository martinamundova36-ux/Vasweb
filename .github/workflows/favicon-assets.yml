name: WEBU favicon PNG and ICO
on:
  push:
    branches: [main]
    paths:
      - favicon.svg
      - .github/workflows/favicon-assets.yml
  workflow_dispatch:
permissions:
  contents: write
  pages: write
jobs:
  favicon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Install image converters
        run: python3 -m pip install --user pillow cairosvg
      - name: Generate complete WEBU favicon set
        run: |
          python3 - <<'PY'
          import io
          import cairosvg
          from PIL import Image
          source='favicon.svg'
          for size in (48,96,180,192,512):
              png=cairosvg.svg2png(url=source,output_width=size,output_height=size)
              with open('apple-touch-icon.png' if size == 180 else 'favicon-'+str(size)+'.png','wb') as out:out.write(png)
          image=Image.open('favicon-512.png').convert('RGBA')
          image.save('favicon.ico',format='ICO',sizes=[(16,16),(32,32),(48,48),(96,96),(192,192),(256,256)])
          PY
      - name: Commit generated favicon assets
        id: commit
        run: |
          git config user.name "WEBU Favicon Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add favicon.ico favicon-*.png apple-touch-icon.png
          if ! git diff --cached --quiet; then
            git commit -m "Generate Google-compatible WEBU favicon assets"
            git pull --rebase origin main
            git push origin HEAD:main
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy regenerated favicon assets through existing Pages build
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --jq '.status'
      - name: Verify generated assets on the public site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/verify_free_deploy.py
