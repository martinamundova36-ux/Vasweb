name: WEBU Journal - automatické SK/EN články
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/free_journal.py'
      - '.github/scripts/editorial_briefs.py'
      - '.github/scripts/ai_journal_writer.py'
      - '.github/scripts/auto_publish_verified.py'
      - '.github/scripts/journal_approval.py'
      - 'scripts/test_journal_approval.py'
      - '.github/scripts/journal_daily_status.py'
      - 'scripts/test_journal_daily_delivery.py'
      - '.github/scripts/verify_free_deploy.py'
      - '.github/scripts/pages_api.py'
      - 'scripts/test_pages_api.py'
      - '.github/workflows/publish-research-journal.yml'
      - 'journal-config.json'
      - 'journal-images.json'
      - 'journal-editorial.css'
      - 'journal-metodika*.html'
      - 'journal-reports/journal-audit-register.json'
      - 'journal-images.css'
      - 'assets/journal/**'
      - '.github/scripts/journal_images.py'
      - '.github/scripts/journal_review_records.py'
      - 'scripts/journal_image_audit.py'
      - 'scripts/test_free_journal.py'
      - 'journal-drafts/*.json'
  schedule:
    - cron: '7,27,47 7-11 * * *'
      timezone: 'Europe/Bratislava'
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      action:
        description: 'draft = pripraviť a automaticky publikovať vhodné abstraktové prehľady; publish = staré ručné články; deploy = obnova; notify-test = test správy'
        type: choice
        options: [draft, publish, deploy, notify-test]
        default: draft
        required: true
      draft_id:
        description: 'Presné ID z journal-drafts/; povinné iba pre publish'
        type: string
        required: false
      resend_notice:
        description: 'Iba notify-test: výslovne poslať nový skrátený testovací e-mail'
        type: boolean
        default: false
        required: false
permissions:
  contents: read
concurrency:
  group: webu-journal-${{ github.event.issue.number || 'discovery' }}
  cancel-in-progress: false
jobs:
  validate:
    outputs:
      daily_due: ${{ steps.daily_due.outputs.due }}
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 .github/scripts/free_journal.py --action self-test
      - run: python3 scripts/test_free_journal.py
      - run: python3 .github/scripts/editorial_briefs.py --self-test
      - run: python3 .github/scripts/ai_journal_writer.py --self-test
      - run: python3 .github/scripts/auto_publish_verified.py --self-test
      - run: python3 scripts/test_abstract_autopublish.py
      - run: python3 scripts/test_pages_api.py
      - run: python3 scripts/journal_image_audit.py
      - run: python3 scripts/journal_review_audit.py
      - run: python3 scripts/test_journal_review.py
      - run: python3 scripts/test_journal_approval.py
      - run: python3 .github/scripts/journal_daily_status.py --self-test
      - run: python3 scripts/test_journal_daily_delivery.py
      - name: Check whether this local day already has a delivery
        id: daily_due
        run: echo "due=$(python3 .github/scripts/journal_daily_status.py --due)" >> "$GITHUB_OUTPUT"
  publish:
    needs: validate
    if: github.event.repository.private == false && ((github.event_name == 'schedule' && needs.validate.outputs.daily_due == 'true') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[journal-recover]')) || (github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner && inputs.action != 'notify-test'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pripraviť bezplatné spracovanie licencovaných fotografií
        run: python3 -m pip install 'Pillow>=11,<14'
      - name: Test bez zverejnenia a bez plateného API
        run: python3 .github/scripts/free_journal.py --action self-test
      - name: Vyhľadať návrh alebo publikovať výslovne schválený článok
        if: inputs.action != 'deploy'
        env:
          JOURNAL_ACTION: ${{ inputs.action || 'draft' }}
          JOURNAL_DRAFT_ID: ${{ inputs.draft_id }}
        run: python3 .github/scripts/free_journal.py --action "$JOURNAL_ACTION" ${JOURNAL_DRAFT_ID:+--draft-id "$JOURNAL_DRAFT_ID"}
      - name: Doplniť SK/EN redakčné osnovy k dnešným bibliografickým podkladom
        if: inputs.action != 'deploy' && inputs.action != 'publish'
        run: python3 .github/scripts/editorial_briefs.py
      - name: Vytvoriť SK/EN redakčné rukopisy podľa abstraktov
        if: inputs.action != 'deploy' && inputs.action != 'publish'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 .github/scripts/ai_journal_writer.py
      - name: Automaticky publikovať transparentne označené prehľady s DOI a vlastnými fotografiami
        if: inputs.action != 'deploy' && inputs.action != 'publish'
        run: python3 .github/scripts/auto_publish_verified.py
      - name: Redakčná a SEO kontrola
        run: |
          python3 scripts/journal_image_audit.py
          python3 scripts/journal_review_audit.py
          python3 scripts/seo_audit.py
          python3 scripts/journal_audit.py --publish-gate
      - name: Evidovať skutočné články oddelene od bibliografických podkladov
        run: python3 .github/scripts/journal_daily_status.py
      - name: Uložiť návrhy alebo schválené články
        if: inputs.action != 'deploy'
        id: commit
        run: |
          git config user.name "WEBU Journal Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add journal-drafts/ journal-articles-pending/ journal-reports/ blog*.html sitemap.xml journal-images.json assets/journal/ WEBU-JOURNAL-IMAGE-LICENSES.md
          if ! git diff --cached --quiet; then
            git commit -m "WEBU Journal free editorial pipeline"
            git pull --rebase origin main
            git push origin HEAD:main
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Ručne obnoviť Pages iba pri výslovnom deploy (push nasadzuje automaticky)
        if: inputs.action == 'deploy'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/pages_api.py
      - name: Overiť nové verejné URL po dokončení Pages
        if: inputs.action == 'deploy' || steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/verify_free_deploy.py
      - name: Záznam výsledku bez uchovávania veľkých artefaktov
        if: always()
        run: |
          echo '### WEBU Journal – bezplatný režim' >> "$GITHUB_STEP_SUMMARY"
          echo 'Automaticky zverejnené texty sú označené ako komentáre na základe abstraktov; bez tvrdenia o nezávislom plnotextovom vedeckom overení. Neúplné zdroje alebo obrázky zostanú blokované.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Záznamy: journal-drafts/ a journal-reports/ v repozitári.' >> "$GITHUB_STEP_SUMMARY"
      - name: Uchovať chybu pre bezpečné opakovanie
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: webu-journal-failure-${{ github.run_id }}
          path: journal-reports/*.json
          retention-days: 7
  notify:
    needs: [validate, publish]
    if: >-
      always() && needs.validate.result == 'success' && github.event.repository.private == false &&
      ((github.event_name == 'schedule' && needs.validate.outputs.daily_due == 'true') ||
       (github.event_name == 'push') ||
       (github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner &&
        (inputs.action == 'notify-test' || (inputs.action == 'draft' && needs.publish.result == 'success'))))
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Jednorazový test starého schvaľovacieho upozornenia
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'notify-test'
        env:
          GH_TOKEN: ${{ github.token }}
          NOTIFY_ACTION: ${{ inputs.action == 'notify-test' && 'notify-test' || 'notify' }}
          RESEND_TEST_NOTICE: ${{ inputs.action == 'notify-test' && inputs.resend_notice && 'true' || 'false' }}
        run: python3 .github/scripts/journal_approval.py --action "$NOTIFY_ACTION"
      - name: Denný pravdivý stav aj pri nepripravených článkoch alebo chybe vyhľadávania
        if: >-
          always() && ((github.event_name == 'schedule' && needs.validate.outputs.daily_due == 'true') ||
          (github.event_name == 'push' && contains(github.event.head_commit.message, '[journal-recover]')) ||
          (github.event_name == 'workflow_dispatch' && inputs.action == 'draft'))
        env:
          GH_TOKEN: ${{ github.token }}
          DISCOVERY_RESULT: ${{ needs.publish.result }}
        run: python3 .github/scripts/journal_approval.py --action daily-report
  decision:
    needs: validate
    if: >-
      github.event_name == 'issue_comment' && github.event.issue.pull_request &&
      github.event.comment.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
      pull-requests: write
      issues: write
      pages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Overiť vlastníčku, presnú verziu a odborné podklady
        id: decision
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/journal_approval.py --action decide
      - name: Povinné kontroly schváleného článku
        if: steps.decision.outputs.publish == 'true'
        run: |
          python3 scripts/seo_audit.py
          python3 scripts/journal_image_audit.py
          python3 scripts/journal_review_audit.py
          python3 scripts/journal_audit.py --publish-gate
      - name: Uložiť rozhodnutie a prípadné schválené publikovanie
        if: steps.decision.outputs.action != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/journal_approval.py --action commit-decision
      - name: Nasadiť iba výslovne schválený článok
        if: steps.decision.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/pages_api.py
          python3 .github/scripts/verify_free_deploy.py
      - name: Oznámiť skutočný výsledok rozhodnutia
        if: always() && steps.decision.outputs.test_only != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          DECISION_SUCCESS: ${{ job.status == 'success' && 'true' || 'false' }}
          DECISION_HEAD_SHA: ${{ steps.decision.outputs.head_sha }}
        run: |
          if [ "$DECISION_SUCCESS" = true ]; then
            python3 .github/scripts/journal_approval.py --action finish --pr-number "$PR_NUMBER"
          else
            python3 .github/scripts/journal_approval.py --action finish --pr-number "$PR_NUMBER" --failed
          fi
