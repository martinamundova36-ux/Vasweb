name: Publikovať WEBU blog
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: read
jobs:
  publish:
    if: github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, '[BLOG]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Vytvoriť článok a aktualizovať blog a sitemap
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python3 .github/scripts/publish_blog.py
      - name: Uložiť publikovaný článok
        run: |
          git config user.name "WEBU Blog Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog.html sitemap.xml blog-*.html
          if ! git diff --cached --quiet; then
            git commit -m "Publish WEBU blog from issue #${{ github.event.issue.number }}"
            git push
          fi
