name: WEBU kvalita blogu a SEO
on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'ukazky/**/*.html'
      - 'language.js'
      - '.github/scripts/audit_webu.py'
      - 'scripts/fragment_audit.py'
      - 'scripts/form_accessibility_audit.py'
      - 'scripts/seo_audit.py'
      - 'student-house-portal/**/*.html'
      - '.github/workflows/audit-webu.yml'
  workflow_dispatch:
  schedule:
    - cron: '20 6 * * *'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Kontrola odkazov, jazykov a SEO
        run: python3 .github/scripts/audit_webu.py
      - name: Kontrola navigácie, odkazov na sekcie a unikátnych ID
        run: python3 scripts/fragment_audit.py
      - name: Kontrola prístupnosti formulárov a vloženého obsahu
        run: python3 scripts/form_accessibility_audit.py
      - name: Kontrola dostupnosti verejnej stránky
        shell: bash
        run: |
          curl --fail --location --retry 2 --connect-timeout 15 --max-time 40 --silent --show-error https://www.webu.sk/ -o /dev/null
          curl --fail --location --retry 2 --connect-timeout 15 --max-time 40 --silent --show-error https://www.webu.sk/sitemap.xml -o /dev/null
