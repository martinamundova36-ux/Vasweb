name: Build approved Bratislava panorama video for multilingual footer

on:
  push:
    branches:
      - student-house-video-preview
    paths:
      - .github/workflows/student-house-approved-panorama.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  encode-approved-video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install image and video codecs
        run: python -m pip install Pillow==11.3.0 imageio-ffmpeg==0.6.0
      - name: Convert the user-approved 1920x840 animation back to web MP4
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bratislava-approved-frames student-house-portal/assets
          curl --fail --location --silent --show-error --retry 3 --retry-delay 2 \
            "https://studenthousebratislavanew.wordpress.com/wp-content/uploads/2026/11/bratislava-approved-video-source-1920.webp" \
            -o /tmp/approved-source.webp
          python - <<'PY'
          from PIL import Image, ImageSequence
          im = Image.open("/tmp/approved-source.webp")
          assert im.size == (1920, 840), f"Unexpected source size {im.size}"
          assert im.is_animated and im.n_frames == 150, f"Unexpected frame count {im.n_frames}"
          for n, frame in enumerate(ImageSequence.Iterator(im)):
              frame.convert("RGB").save(f"/tmp/bratislava-approved-frames/{n:05d}.png")
          print(f"Decoded {im.n_frames} frames preserving the approved video")
          PY
          FFMPEG="$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')"
          "$FFMPEG" -hide_banner -loglevel error -y -framerate 24 \
            -i /tmp/bratislava-approved-frames/%05d.png -an \
            -c:v libx264 -preset medium -crf 17 -pix_fmt yuv420p \
            -movflags +faststart -g 48 \
            student-house-portal/assets/bratislava-approved-footer-1920x840.mp4
          test -s student-house-portal/assets/bratislava-approved-footer-1920x840.mp4
          file student-house-portal/assets/bratislava-approved-footer-1920x840.mp4
          ls -lh student-house-portal/assets/bratislava-approved-footer-1920x840.mp4
      - name: Store on preview branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add student-house-portal/assets/bratislava-approved-footer-1920x840.mp4
          if ! git diff --cached --quiet; then
            git commit -m "Add approved Bratislava panorama video for SK EN RU UA footers"
            git push origin HEAD:student-house-video-preview
          fi
