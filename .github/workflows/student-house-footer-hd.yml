name: Student House HD Bratislava Footer Video

on:
  push:
    branches:
      - student-house-video-preview
    paths:
      - .github/workflows/student-house-footer-hd.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  make-hd-bratislava-video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg binary
        run: python -m pip install imageio-ffmpeg==0.6.0
      - name: Render HD moving Bratislava footage and HD poster
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p student-house-portal/assets
          curl --fail --location --silent --show-error --retry 3 \
            "https://studenthousebratislavanew.wordpress.com/wp-content/uploads/2026/11/vecerna-bratislava-student-house.png" \
            -o /tmp/bratislava-original.png
          FFMPEG="$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')"
          "$FFMPEG" -hide_banner -loglevel error -y \
            -loop 1 -framerate 24 -i /tmp/bratislava-original.png \
            -t 15 -vf "scale=2112:905:flags=lanczos,crop=1920:820:x='(iw-ow)/2+(iw-ow)/3*sin(2*PI*n/360)':y='(ih-oh)/2+(ih-oh)/3*cos(2*PI*n/360)',eq=contrast=1.04:saturation=1.06" \
            -c:v libx264 -preset medium -crf 18 -pix_fmt yuv420p -movflags +faststart -an \
            student-house-portal/assets/bratislava-footer-hd-1920.mp4
          "$FFMPEG" -hide_banner -loglevel error -y \
            -ss 1 -i student-house-portal/assets/bratislava-footer-hd-1920.mp4 \
            -frames:v 1 -q:v 2 \
            student-house-portal/assets/bratislava-footer-hd-poster.jpg
          test -s student-house-portal/assets/bratislava-footer-hd-1920.mp4
          test -s student-house-portal/assets/bratislava-footer-hd-poster.jpg
          ls -lh student-house-portal/assets/bratislava-footer-hd-1920.mp4 student-house-portal/assets/bratislava-footer-hd-poster.jpg
      - name: Commit preview assets to this preview branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add student-house-portal/assets/bratislava-footer-hd-1920.mp4 student-house-portal/assets/bratislava-footer-hd-poster.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Add sharp HD moving Bratislava footer video to preview branch"
            git push origin HEAD:student-house-video-preview
          fi
