name: WEBU Journal - denne overovanie zahranicnych vyskumov
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6,7 * * *'
permissions:
  contents: read
  issues: write
concurrency:
  group: webu-research-daily
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Spustit iba o 08:00 Europe/Bratislava
        id: clock
        shell: bash
        run: |
          if [ "$(TZ=Europe/Bratislava date +%H)" = "08" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Overit aktualne vedecke zdroje a pripravit redakcny report
        if: github.event_name == 'workflow_dispatch' || steps.clock.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/research_journal.py

      - name: Overit DOI a bibliografiu v Crossref
        if: github.event_name == 'workflow_dispatch' || steps.clock.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/verify_research.py
