name: WEBU live indexability check
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-indexability.yml'
  workflow_dispatch:
  schedule:
    - cron: '37 7 * * 1'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check publicly served pages and sitemap
        shell: bash
        run: |
          python3 - <<'PY'
          from urllib.request import Request, urlopen
          from urllib.error import URLError
          from html.parser import HTMLParser
          import xml.etree.ElementTree as ET
          from urllib.parse import urlparse
          BASE = 'https://www.webu.sk'
          URLS = ['/', '/sluzby.html', '/portfolio.html', '/kontakt.html', '/blog.html', '/blog-en.html', '/robots.txt', '/sitemap.xml']
          class SEO(HTMLParser):
              def __init__(self):
                  super().__init__(); self.noindex = False; self.canonical = []
              def handle_starttag(self, tag, attrs):
                  a = dict(attrs)
                  if tag == 'meta' and a.get('name', '').lower() in ('robots', 'googlebot'):
                      if 'noindex' in a.get('content', '').lower(): self.noindex = True
                  if tag == 'link' and 'canonical' in a.get('rel', '').lower().split():
                      self.canonical.append(a.get('href', ''))
          fail = []
          for path in URLS:
              url = BASE + path
              try:
                  with urlopen(Request(url, headers={'User-Agent':'WEBU-SEO-Monitor/1.0'}), timeout=25) as r:
                      status = r.status
                      resolved = r.url
                      payload = r.read().decode('utf-8', errors='replace')
                      xrobots = r.headers.get('X-Robots-Tag','')
                  print(f'{status} {url} -> {resolved}')
                  if status != 200 or resolved != url: fail.append(f'Unexpected status or redirect: {url}')
                  if 'noindex' in xrobots.lower(): fail.append(f'X-Robots-Tag noindex: {url}')
                  if path.endswith('.html') or path == '/':
                      seo = SEO(); seo.feed(payload)
                      if seo.noindex: fail.append(f'HTML noindex: {url}')
                      if seo.canonical != [url]: fail.append(f'Canonical mismatch: {url}: {seo.canonical}')
                  if path == '/robots.txt' and 'Sitemap: https://www.webu.sk/sitemap.xml' not in payload:
                      fail.append('robots.txt missing sitemap reference')
                  if path == '/sitemap.xml':
                      root = ET.fromstring(payload)
                      locations = [e.text for e in root.iter() if e.tag.endswith('}loc')]
                      print(f'Sitemap contains {len(locations)} URLs')
                      for required in (BASE+'/',BASE+'/sluzby.html',BASE+'/portfolio.html',BASE+'/kontakt.html',BASE+'/blog.html'):
                          if required not in locations: fail.append(f'Sitemap missing {required}')
                      if len(locations) < 20: fail.append('Unexpectedly small sitemap')
              except (URLError, OSError, ValueError, ET.ParseError) as exc:
                  fail.append(f'{url}: {type(exc).__name__}: {exc}')
          for issue in fail: print('::error::'+issue)
          if fail: raise SystemExit(1)
          print('Live WEBU indexability checks passed; Google indexing is not guaranteed.')
          PY
