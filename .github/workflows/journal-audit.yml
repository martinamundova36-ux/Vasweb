name: WEBU Journal editorial checks
on:
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
  pull_request:
    paths:
      - 'blog*.html'
      - 'scripts/*.py'
      - '.github/scripts/*.py'
      - 'journal-share.js'
      - 'journal-images.css'
      - 'journal-images.json'
      - 'journal-editorial.css'
      - 'journal-metodika*.html'
      - 'journal-reports/journal-audit-register.json'
      - 'assets/journal/**'
      - 'sitemap.xml'
      - 'robots.txt'
      - '.github/workflows/journal-audit.yml'
  push:
    branches: [main]
    paths:
      - 'blog*.html'
      - 'scripts/*.py'
      - '.github/scripts/*.py'
      - 'journal-share.js'
      - 'journal-images.css'
      - 'journal-images.json'
      - 'journal-editorial.css'
      - 'journal-metodika*.html'
      - 'journal-reports/journal-audit-register.json'
      - 'assets/journal/**'
      - 'sitemap.xml'
      - 'robots.txt'
      - '.github/workflows/journal-audit.yml'
  workflow_dispatch:
  schedule:
    - cron: '15 6 * * *'
jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/journal_image_audit.py
      - run: python3 scripts/journal_review_audit.py
      - run: python3 scripts/test_journal_review.py
      - name: Validate indexability and bilingual SEO for all articles
        run: python3 scripts/seo_audit.py
      - name: Validate blog metadata, references and links
        env:
          JOURNAL_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/journal_audit.py | tee journal-audit-report.txt; exit ${PIPESTATUS[0]}
      - name: Record deployed article URLs on scheduled or requested audit
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python3 scripts/check_deployed_urls.py
      - name: Archive editorial audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webu-journal-audit-${{ github.run_id }}
          path: |
            journal-audit-report.txt
            deployment-url-report.json
          if-no-files-found: warn
          retention-days: 30

  deployed-urls:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Record public article URLs and deployment results
        run: python3 scripts/check_deployed_urls.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webu-deployed-urls-${{ github.run_id }}
          path: deployment-url-report.json
          retention-days: 30
