name: Residence portal regression tests

on:
  push:
    paths:
      - 'student-house-portal/**'
      - 'supabase/functions/register-student/**'
      - 'tests/residence-portal.test.mjs'
      - '.github/workflows/residence-regression.yml'
  pull_request:
    paths:
      - 'student-house-portal/**'
      - 'supabase/functions/register-student/**'
      - 'tests/residence-portal.test.mjs'

concurrency:
  group: residence-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  residence-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/residence-portal.test.mjs
