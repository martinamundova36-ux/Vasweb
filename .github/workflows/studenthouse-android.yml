name: Student House Bratislava Android security smoke & test APK
on:
  push:
    paths:
      - 'android-studenthouse/**'
      - '.github/workflows/studenthouse-android.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out existing WEBU Residence repository
        uses: actions/checkout@v4
      - name: Verify Android security settings
        shell: bash
        run: |
          set -euo pipefail
          java=android-studenthouse/app/src/main/java/sk/studenthouse/app/MainActivity.java
          manifest=android-studenthouse/app/src/main/AndroidManifest.xml
          grep -Fq 'setWebContentsDebuggingEnabled(false)' "$java"
          grep -Fq 'setSafeBrowsingEnabled(true)' "$java"
          grep -Fq 'handler.cancel()' "$java"
          grep -Fq 'isTrustedPortal(uri)' "$java"
          grep -Fq 'setMixedContentMode(WebSettings.MIXED_CONTENT_NEVER_ALLOW)' "$java"
          grep -Fq 'setAllowFileAccess(false)' "$java"
          grep -Fq 'setAllowUniversalAccessFromFileURLs(false)' "$java"
          grep -Fq 'setAcceptThirdPartyCookies(browser, false)' "$java"
          grep -Fq 'android:usesCleartextTraffic="false"' "$manifest"
          grep -Fq 'android:allowBackup="false"' "$manifest"
          test "$(grep -c '<uses-permission' "$manifest")" -eq 1
          grep -Fq 'android.permission.INTERNET' "$manifest"
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build internal test APK
        run: gradle -p android-studenthouse :app:assembleDebug --no-daemon
      - name: Upload internal test APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Studenthouse-internal-debug-APK
          path: android-studenthouse/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
