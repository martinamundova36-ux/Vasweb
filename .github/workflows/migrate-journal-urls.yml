name: WEBU migrate old Journal URLs
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migrate-journal-urls.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: webu-journal-url-migration
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Migrate legacy Journal URL pairs while retaining old links
        run: python3 .github/scripts/migrate_journal_urls.py
      - name: Rebuild cross-article internal links and SEO metadata
        run: |
          python3 .github/scripts/link_journal_articles.py
          python3 .github/scripts/seo_journal.py
          python3 .github/scripts/sync_sitemap.py
      - name: Validate editorial integrity and indexability before publishing
        run: |
          python3 scripts/journal_review_audit.py
          python3 scripts/seo_audit.py
          python3 scripts/journal_audit.py --publish-gate
      - name: Commit migration without overwriting concurrent changes
        run: |
          git config user.name "WEBU SEO Migration Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- 'blog*.html' journal-reports/journal-audit-register.json journal-reports/journal-url-migration.json journal-images.json sitemap.xml
          if ! git diff --cached --quiet; then
            git commit -m "Migrate old Journal URLs to readable titles with backward-compatible redirects"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
