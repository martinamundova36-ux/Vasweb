name: Synchronizovať WEBU sitemap
on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - '.github/scripts/audit_webu.py'
      - '.github/scripts/sync_sitemap.py'
      - '.github/workflows/sync-sitemap.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: webu-sitemap-main
  cancel-in-progress: false
jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Odstrániť neplatné karty blogu a skontrolovať SEO
        run: python3 .github/scripts/audit_webu.py
      - name: Zostaviť sitemap z aktuálnych stránok
        run: python3 .github/scripts/sync_sitemap.py
      - name: Uložiť sitemap iba ak sa zmenila
        run: |
          git config user.name "WEBU Sitemap Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml blog.html blog-en.html
          if ! git diff --cached --quiet; then
            git commit -m "Automatically synchronize WEBU sitemap"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
