name: Synchronizovať WEBU sitemap
on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'ukazky/**/*.html'
      - 'scripts/seo_audit.py'
      - '.github/scripts/audit_webu.py'
      - '.github/scripts/sync_sitemap.py'
      - '.github/scripts/link_journal_articles.py'
      - '.github/scripts/seo_journal.py'
      - '.github/scripts/sync_favicon.py'
      - '.github/scripts/sync_journal_brand.py'
      - '.github/workflows/sync-sitemap.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: webu-sitemap-main
  cancel-in-progress: false
jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
          fetch-depth: 0
      - name: Odstrániť neplatné karty blogu a skontrolovať SEO
        run: python3 .github/scripts/audit_webu.py
      - name: Prepojit vsetky SK a EN clanky s relevantnym obsahom
        run: python3 .github/scripts/link_journal_articles.py
      - name: SEO metadáta, JSON-LD, canonical, hreflang a kontrola odkazov
        run: python3 .github/scripts/seo_journal.py
      - name: Zjednotit nazov WEBU Journal na vsetkych strankach
        run: python3 .github/scripts/sync_journal_brand.py
      - name: Zjednotit favicon na vsetkych strankach
        run: python3 .github/scripts/sync_favicon.py
      - name: Zostaviť sitemap z aktuálnych stránok
        run: python3 .github/scripts/sync_sitemap.py
      - name: Zastaviť uloženie pri chybe SEO
        run: python3 scripts/seo_audit.py
      - name: Uložiť sitemap iba ak sa zmenila
        run: |
          git config user.name "WEBU Sitemap Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml '*.html' '**/*.html'
          if ! git diff --cached --quiet; then
            git commit -m "Automatically synchronize WEBU sitemap"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort
                echo "::error::Rebase conflict. No remote changes were overwritten."
                exit 1
              fi
              if git push origin HEAD:main; then
                echo "WEBU sitemap saved successfully."
                exit 0
              fi
              echo "::warning::Remote main changed during push (attempt ${attempt}/5); retrying."
              sleep $((attempt * 2))
            done
            echo "::error::Could not push sitemap after five safe retries."
            exit 1
          fi
