name: Student House public registration smoke test
on:
  push:
    paths:
      - 'student-house-portal/**'
      - '.github/workflows/student-house-smoke.yml'
      - 'tests/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-registration-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check login page JavaScript syntax and registration fields
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const html = fs.readFileSync('student-house-portal/index.html','utf8');
          const staff = fs.readFileSync('student-house-portal/staff.js','utf8');
          const scripts = [...html.matchAll(/<script\b[^>]*>([\s\S]*?)<\/script>/gi)].map(x=>x[1]).filter(Boolean);
          if (!scripts.length) throw new Error('Inline JavaScript missing');
          for (const source of scripts) new vm.Script(source);
          for (const id of ['regFirst','regLast','regRoom','regRoomType','regFrom','regTo','regEmail','regPrivacy','regForm']) {
            if (!html.includes('id="'+id+'"')) throw new Error('Missing registration field '+id);
          }
          if (html.includes('id="regContract"')) throw new Error('Contract number must remain staff-only');
          if (!html.includes('<select id="regRoom"') || !html.includes('<select id="regRoomType"'))
            throw new Error('Room preferences must be dropdown controls, not free text');
          if (!html.includes('const PUBLIC_ROOM_CATALOG=') || !html.includes('updateRoomPreferenceOptions'))
            throw new Error('Filtered room dropdown data or handler missing');
          if (!html.includes('functions/v1/register-student')) throw new Error('Missing submission endpoint');
          if (!html.includes('id="backToWebsite"') || !html.includes('position:sticky')) throw new Error('Persistent back to Student House link missing');
          if (!html.includes('residence-finance') || !html.includes('resident_document') || !html.includes("await import('/student-house-portal/staff.js?v=") || !staff.includes('registration_id:person.id')) throw new Error('Real finance, private documents or verified approval missing');
          if (!html.includes('id="orgSelector"') || !html.includes('chooseOrganization(')) throw new Error('Residence switcher missing');
          for(const name of ["installments","documents","registrations","payments","cleaning","notices","rooms","requests"]){
            if(name==='registrations'){if(!html.includes('renderStaffScreen(') || !staff.includes('registration_id:person.id'))throw new Error('Missing secure staff registration section');continue;}
            if(!html.includes("tab==='"+name+"'"))throw new Error("Missing dashboard section: "+name);
          }
          if(!html.includes("portal-open") || !html.includes("function statusPill"))throw new Error('Authenticated interior layout missing');
          if(!html.includes("renderProfile(tenant)") || !html.includes("renderResidentDocuments(tenant,staff,own)") || !html.includes("renderStudentEnquiry("))throw new Error('Profile, questionnaire or signed-document inbox missing');
          if(!html.includes("functions.invoke('residence-files'") || !html.includes("profile_photo") || !html.includes("signed_rules") || !html.includes("signed_gdpr"))throw new Error('Private uploads not integrated');
          const fileEndpoint=fs.readFileSync('student-house-portal/supabase/residence-files/index.ts','utf8');
          if(!fileEndpoint.includes('getUser()') || !fileEndpoint.includes('residence_portal_files') || !fileEndpoint.includes('verified_resident_required'))throw new Error('Private file security checks missing');
          const preview=fs.readFileSync('student-house-portal/preview.html','utf8');
          if(!preview.includes('url=/student-house-portal/') || preview.includes('Iba ilustračné údaje'))throw new Error('Old illustrative demo was not redirected to real portal');
          if (!html.includes("select('tenant_id,role').eq('user_id',u.id).eq('active',true).limit(50)")) throw new Error('Membership selector missing');
          const finance=fs.readFileSync('student-house-portal/supabase/residence-finance/index.ts','utf8');
          if(!finance.includes('auth.getUser()') || !finance.includes('residence_record_payment') || !finance.includes('residence_create_installment_plan')) throw new Error('Secured finance API implementation missing');
          const manage=fs.readFileSync('student-house-portal/supabase/manage/index.ts','utf8');
          const approval=fs.readFileSync('student-house-portal/supabase/migrations/20261112193508_atomic_registration_approval.sql','utf8');
          if(!manage.includes('registration_not_pending') || !manage.includes('residence_approve_registration') || !approval.includes('verified_contract_number')) throw new Error('Reception verification contract logic missing');
          const edge = fs.readFileSync('student-house-portal/supabase/register-student/index.ts','utf8');
          if (!edge.includes('.not("verified_at","is",null)') || !edge.includes('p_tenant:tenantId') || !edge.includes('residence_submit_registration')) throw new Error('Verified-domain tenant routing missing');
          console.log('Registration, multi-residence switcher and tenant routing checks passed');
          JS
      - name: Check live public registration endpoint rejects invalid data
        run: |
          node <<'JS'
          (async()=>{
            const response = await fetch('https://ydqchayscxntqdkzkynv.supabase.co/functions/v1/register-student',{
              method:'POST',
              headers:{origin:'https://www.webu.sk','content-type':'application/json'},
              body:JSON.stringify({privacy_acknowledged:false})
            });
            const body=await response.json();
            if(response.status!==400 || body.error!=='invalid_fields'){
              throw new Error('Unexpected endpoint response: '+response.status+' '+JSON.stringify(body));
            }
            const options = await fetch('https://ydqchayscxntqdkzkynv.supabase.co/functions/v1/register-student',{
              method:'OPTIONS',headers:{origin:'https://www.webu.sk','access-control-request-method':'POST','access-control-request-headers':'content-type'}
            });
            if(options.status!==204 || options.headers.get('access-control-allow-origin')!=='https://www.webu.sk'){
              throw new Error('Legacy origin CORS preflight failed: '+options.status);
            }
            const refused = await fetch('https://ydqchayscxntqdkzkynv.supabase.co/functions/v1/register-student',{
              method:'OPTIONS',headers:{origin:'https://unverified.invalid','access-control-request-method':'POST'}
            });
            if(refused.status!==403 || refused.headers.get('access-control-allow-origin')){
              throw new Error('Unverified origin was not rejected correctly: '+refused.status);
            }
            console.log('Public registration validation, legacy CORS, unverified origin rejection OK');
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Check live resident files endpoint protects private uploads
        run: |
          node <<'JS'
          (async()=>{
            const url='https://ydqchayscxntqdkzkynv.supabase.co/functions/v1/residence-files';
            const options=await fetch(url,{method:'OPTIONS',headers:{origin:'https://www.webu.sk','access-control-request-method':'POST','access-control-request-headers':'content-type,authorization'}});
            if(options.status!==204 || options.headers.get('access-control-allow-origin')!=='https://www.webu.sk')throw new Error('File CORS preflight failed: '+options.status);
            const rejected=await fetch(url,{method:'OPTIONS',headers:{origin:'https://unverified.invalid','access-control-request-method':'POST'}});
            if(rejected.status!==403 || rejected.headers.get('access-control-allow-origin'))throw new Error('Unverified file origin was not denied');
            const noAuth=await fetch(url,{method:'POST',headers:{origin:'https://www.webu.sk','content-type':'application/json'},body:JSON.stringify({action:'download',tenant_id:'ae045243-98f0-4f22-a736-d33a92f9ba61'})});
            const data=await noAuth.json();
            if(noAuth.status!==401 || data.error!=='unauthorized')throw new Error('Private download without login not denied: '+noAuth.status+' '+JSON.stringify(data));
            console.log('Resident file endpoint CORS and unauthorized access tests passed');
          })().catch(e=>{console.error(e);process.exit(1)});
          JS

      - name: Ensure unregistered users cannot access manager or financial endpoints
        run: |
          node <<'JS'
          (async()=>{
            const root='https://ydqchayscxntqdkzkynv.supabase.co/functions/v1/';
            for(const endpoint of ['manage','residence-finance']){
              const response=await fetch(root+endpoint,{
                method:'POST',
                headers:{origin:'https://www.webu.sk','content-type':'application/json'},
                body:JSON.stringify({action:'payment',tenant_id:'00000000-0000-0000-0000-000000000000'})
              });
              const data=await response.json();
              if(response.status!==401 || data.error!=='unauthorized'){
                throw new Error('Unprotected '+endpoint+' endpoint: '+response.status+' '+JSON.stringify(data));
              }
              const options=await fetch(root+endpoint,{
                method:'OPTIONS',
                headers:{origin:'https://www.webu.sk','access-control-request-method':'POST','access-control-request-headers':'authorization,content-type'}
              });
              if(![200,204].includes(options.status)||options.headers.get('access-control-allow-origin')!=='https://www.webu.sk'){
                throw new Error('Unexpected authenticated endpoint preflight '+endpoint+': '+options.status);
              }
            }
            console.log('Unauthenticated staff routes denied and cross-origin preflight OK');
          })().catch(e=>{console.error(e);process.exit(1)});
          JS

  isolated-functional-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - run: npm ci --prefix tests --ignore-scripts
      - run: npm test --prefix tests
      - run: npx --prefix tests playwright install --with-deps chromium webkit
      - run: npm run browser --prefix tests
