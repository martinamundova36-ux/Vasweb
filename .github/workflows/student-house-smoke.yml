name: Student House public registration smoke test
on:
  push:
    paths:
      - 'student-house-portal/**'
      - '.github/workflows/student-house-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-registration-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check login page JavaScript syntax and registration fields
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const html = fs.readFileSync('student-house-portal/index.html','utf8');
          const scripts = [...html.matchAll(/<script\b[^>]*>([\s\S]*?)<\/script>/gi)].map(x=>x[1]).filter(Boolean);
          if (!scripts.length) throw new Error('Inline JavaScript missing');
          for (const source of scripts) new vm.Script(source);
          for (const id of ['regFirst','regLast','regRoom','regContract','regFrom','regTo','regEmail','regPrivacy','regForm']) {
            if (!html.includes('id="'+id+'"')) throw new Error('Missing registration field '+id);
          }
          if (!html.includes('functions/v1/register-student')) throw new Error('Missing submission endpoint');
          if (!html.includes('id="orgSelector"') || !html.includes('chooseOrganization(')) throw new Error('Residence switcher missing');
          if (!html.includes("select('tenant_id,role').eq('user_id',u.id).eq('active',true).limit(50)")) throw new Error('Membership selector missing');
          const edge = fs.readFileSync('student-house-portal/supabase/register-student/index.ts','utf8');
          if (!edge.includes('.not("verified_at","is",null)') || !edge.includes('tenant_id:tenantId')) throw new Error('Verified-domain tenant routing missing');
          console.log('Registration, multi-residence switcher and tenant routing checks passed');
          JS
      - name: Check live public registration endpoint rejects invalid data
        run: |
          node <<'JS'
          (async()=>{
            const response = await fetch('https://ydqchayscxntqdkzkynv.supabase.co/functions/v1/register-student',{
              method:'POST',
              headers:{origin:'https://www.webu.sk','content-type':'application/json'},
              body:JSON.stringify({privacy_acknowledged:false})
            });
            const body=await response.json();
            if(response.status!==400 || body.error!=='invalid_fields'){
              throw new Error('Unexpected endpoint response: '+response.status+' '+JSON.stringify(body));
            }
            const options = await fetch('https://ydqchayscxntqdkzkynv.supabase.co/functions/v1/register-student',{
              method:'OPTIONS',headers:{origin:'https://www.webu.sk','access-control-request-method':'POST','access-control-request-headers':'content-type'}
            });
            if(options.status!==204 || options.headers.get('access-control-allow-origin')!=='https://www.webu.sk'){
              throw new Error('Legacy origin CORS preflight failed: '+options.status);
            }
            const refused = await fetch('https://ydqchayscxntqdkzkynv.supabase.co/functions/v1/register-student',{
              method:'OPTIONS',headers:{origin:'https://unverified.invalid','access-control-request-method':'POST'}
            });
            if(refused.status!==403 || refused.headers.get('access-control-allow-origin')){
              throw new Error('Unverified origin was not rejected correctly: '+refused.status);
            }
            console.log('Public registration validation, legacy CORS, unverified origin rejection OK');
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
