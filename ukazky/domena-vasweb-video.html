<!doctype html><html lang="sk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VASWEB – Doména a publikovanie</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 10%,#294a72,#081529 65%);color:white;font:16px/1.5 system-ui,sans-serif}.stage{min-height:100vh;display:grid;place-items:center;padding:65px 25px}.brand{position:absolute;top:18px;left:26px;font-size:24px;font-weight:900;letter-spacing:-1px}.brand span,.step{color:#f4c766}.content{width:min(900px,100%);display:grid;grid-template-columns:1fr 1fr;gap:35px;align-items:center}.step{font-weight:800;letter-spacing:3px;text-transform:uppercase;font-size:12px}h1{font-size:clamp(32px,5vw,58px);letter-spacing:-2px;line-height:1.05;margin:12px 0}p{font-size:19px;color:#d1dcec}.laptop{border:9px solid #7186a2;border-bottom-width:17px;border-radius:16px;aspect-ratio:16/10;background:#e8f1fa;overflow:hidden;box-shadow:0 25px 75px #000a;animation:float 4s infinite ease-in-out}.bar{height:14%;background:#142943;display:flex;align-items:center;gap:6px;padding:10px}.bar i{width:7px;height:7px;border-radius:50%;background:#f4c766}.screen{padding:8%;color:#142943}.screen h2{font-size:clamp(19px,3vw,33px);line-height:1.1}.line{height:8px;background:#b8c9dc;border-radius:9px;width:75%;margin:12px 0}.short{width:45%}.button{width:44%;height:24px;background:#f4c766;border-radius:20px;margin-top:25px}.status{background:#f4c766;color:#10213b;font-weight:900;border-radius:40px;padding:12px 19px;position:relative;float:right;margin-top:-17px;box-shadow:0 9px 30px #0006}.controls{position:absolute;bottom:16px;left:4%;right:4%;display:flex;align-items:center;gap:12px}.controls button{border:1px solid #ffffff66;background:#ffffff13;color:white;border-radius:20px;padding:9px 13px;cursor:pointer}.track{height:7px;background:#ffffff30;border-radius:10px;flex:1;overflow:hidden}.fill{height:100%;width:0;background:#f4c766}.time{font-size:13px;font-variant-numeric:tabular-nums}@keyframes float{50%{transform:translateY(-7px)}}@media(max-width:680px){.stage{padding:75px 20px 80px}.content{grid-template-columns:1fr;gap:22px}h1{font-size:36px}p{font-size:16px}.laptop{max-width:420px;margin:auto}}@media(prefers-reduced-motion:reduce){.laptop{animation:none}}
</style></head><body><main class="stage"><div class="brand">vas<span>web</span></div><div class="content"><div><div class="step" id="step"></div><h1 id="title"></h1><p id="desc"></p></div><div><div class="laptop"><div class="bar"><i></i><i></i><i></i></div><div class="screen"><h2 id="mock"></h2><div class="line"></div><div class="line short"></div><div class="button"></div></div></div><div class="status" id="status"></div></div></div><div class="controls"><button id="play">Ⅱ</button><div class="track"><div class="fill" id="fill"></div></div><span class="time" id="time">0:00 / 0:40</span><button id="again">↻</button></div></main><script>
(()=>{const en=new URLSearchParams(location.search).get('lang')==='en';document.documentElement.lang=en?'en':'sk';const scenes=en?[
['01 / Brief','Your idea. Our plan.','We learn what your business needs.','YOUR IDEA','Brief received'],['02 / Design','We build your website.','Modern design and a great mobile experience.','YOUR WEBSITE','Design ready'],['03 / Domain','Your own web address.','We connect a domain for your brand.','www.yourbrand.com','Domain connected'],['04 / Publish','We put it online.','GitHub Pages hosting with HTTPS.','GITHUB PAGES','Site is live'],['05 / Launch','Your business is online.','Your new website is ready for visitors.','WELCOME ONLINE','All done']]:[
['01 / Zadanie','Váš nápad. Náš plán.','Zistíme, čo potrebuje vaše podnikanie.','VÁŠ NÁPAD','Zadanie prijaté'],['02 / Dizajn','Vytvoríme váš web.','Moderný dizajn a výborné zobrazenie na mobile.','VAŠA STRÁNKA','Dizajn hotový'],['03 / Doména','Vaša vlastná adresa.','Prepojíme doménu vašej značky.','www.vasafirma.sk','Doména pripojená'],['04 / Publikovanie','Spustíme web online.','Publikujeme cez GitHub Pages a nastavíme HTTPS.','GITHUB PAGES','Web je online'],['05 / Spustenie','Vaša firma je online.','Nový web je pripravený pre návštevníkov.','VITAJTE ONLINE','Hotovo']];
let t=0,playing=true;const $=id=>document.getElementById(id);function draw(){const s=scenes[Math.min(4,Math.floor(t/8))];['step','title','desc','mock','status'].forEach((id,i)=>$(id).textContent=s[i]);$('fill').style.width=(t/40*100)+'%';$('time').textContent='0:'+String(t).padStart(2,'0')+' / 0:40'}setInterval(()=>{if(!playing)return;if(t===40){playing=false;$('play').textContent='▶';return}t++;draw()},1000);$('play').onclick=()=>{if(t===40)t=0;playing=!playing;$('play').textContent=playing?'Ⅱ':'▶';draw()};$('again').onclick=()=>{t=0;playing=true;$('play').textContent='Ⅱ';draw()};draw()})();
</script></body></html>
